name: Build Windows Executable

on:
  workflow_dispatch: # Zorgt ervoor dat je de workflow handmatig kunt starten via de GitHub UI
  push:
    branches:
      - main # Start automatisch bij een push naar de main branch

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen (voor Svelte)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Pas aan als je een specifieke Node versie gebruikt

      - name: Frontend installeren en bouwen
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Pas aan naar jouw Python versie

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bouw de .exe met PyInstaller
        run: |
          # De pyinstaller commando's:
          # --onefile: Maakt er één .exe van
          # --add-binary "go2rtc.exe;.": Voegt go2rtc toe aan de hoofdmap van de exe
          # --add-data "frontend/dist;frontend/dist": Voegt de gebouwde Svelte app toe
          # --add-data "data;data": Voegt je data map toe (zie waarschuwing hieronder!)
          
          pyinstaller --noconfirm --onefile --name "AgLoadMonitor" `
            --add-binary "go2rtc.exe;." `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "data;data" `
            run.py

      - name: Upload .exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgLoadMonitor-Windows
          path: dist/AgLoadMonitor.exe

name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen (voor Svelte)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend installeren en bouwen
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Forceer de installatie van alle cruciale pakketten direct in de action
          pip install pyinstaller ultralytics flask websockets opencv-python-headless numpy

      - name: Download go2rtc
        run: |
          Invoke-WebRequest -Uri "https://github.com/AlexxIT/go2rtc/releases/latest/download/go2rtc_win64.zip" -OutFile "go2rtc.zip"
          Expand-Archive -Path "go2rtc.zip" -DestinationPath "."
          
          # Controleer of het bestand succesvol is uitgepakt
          if (Test-Path "go2rtc.exe") { 
              Write-Host "✅ go2rtc.exe is succesvol gedownload en uitgepakt!" 
          } else {
              Write-Error "❌ go2rtc.exe niet gevonden na uitpakken!"
              exit 1
          }

      - name: Bouw de .exe met PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "AgLoadMonitor" `
            --add-binary "go2rtc.exe;." `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "weights;weights" `
            --collect-all ultralytics `
            --collect-all flask `
            --hidden-import flask `
            --hidden-import websockets `
            run.py

      - name: Upload .exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgLoadMonitor-Windows
          path: dist/AgLoadMonitor.exe

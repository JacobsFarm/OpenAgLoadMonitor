name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen (voor Svelte)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend installeren en bouwen
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bouw de .exe met PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "AgLoadMonitor" `
            --add-binary "go2rtc.exe;." `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "weights;weights" `
            run.py

      - name: Upload .exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgLoadMonitor-Windows
          path: dist/AgLoadMonitor.exe

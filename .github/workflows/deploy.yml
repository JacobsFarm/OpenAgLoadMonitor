name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'        # bv. v0.2.0 -> bouwt én publiceert een release met de .exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen (voor Svelte)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend installeren en bouwen
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bouw de .exe met PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "AgLoadMonitor" `
            --add-data "frontend/dist;frontend/dist" `
            --collect-all ultralytics `
            --collect-all flask `
            --collect-all cryptography `
            --hidden-import flask `
            run.py

      - name: Upload .exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgLoadMonitor-Windows
          path: dist/AgLoadMonitor.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen (voor Svelte)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend installeren en bouwen
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bouw de Linux-binary met PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "AgLoadMonitor" \
            --add-data "frontend/dist:frontend/dist" \
            --collect-all ultralytics \
            --collect-all flask \
            --collect-all cryptography \
            --hidden-import flask \
            run.py

      - name: Upload Linux-binary als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgLoadMonitor-Linux
          path: dist/AgLoadMonitor

  # Alleen bij een versietag (vX.Y.Z): de gebouwde binaries als downloadbare
  # release-assets op de GitHub Releases-pagina zetten zodat je ze kunt delen.
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Artifacts ophalen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Binaries klaarzetten met duidelijke namen
        run: |
          mkdir -p release
          cp "artifacts/AgLoadMonitor-Windows/AgLoadMonitor.exe" "release/AgLoadMonitor-Windows.exe"
          cp "artifacts/AgLoadMonitor-Linux/AgLoadMonitor" "release/AgLoadMonitor-Linux"

      - name: Release publiceren met de binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgLoadMonitor-Windows.exe
            release/AgLoadMonitor-Linux
          generate_release_notes: true
